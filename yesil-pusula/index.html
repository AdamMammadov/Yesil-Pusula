<section class="view" id="view-firm" hidden>
<div class="banner" data-i18n="banner"></div>

<main class="layout">
  <aside class="panel">
    <form id="f" novalidate autocomplete="off">
      <fieldset>
        <legend data-i18n="s_facility"></legend>
        <label for="company" data-i18n="company"></label>
        <input id="company" type="text">
        <div class="row2">
          <div><label for="country" data-i18n="country"></label><select id="country"></select></div>
          <div><label for="year" data-i18n="year"></label><select id="year"></select></div>
        </div>
        <label for="product" data-i18n="product"></label>
        <select id="product"></select>
        <div id="scopeWrap" hidden><label for="scope" data-i18n="scope"></label><select id="scope"></select></div>
        <div class="row2">
          <div><label for="production_t" data-i18n="production"></label><div class="inp"><input id="production_t" type="number" min="0" step="any"><span>t</span></div></div>
          <div><label for="export_t" data-i18n="export"></label><div class="inp"><input id="export_t" type="number" min="0" step="any"><span>t</span></div></div>
        </div>
        <label for="route" data-i18n="route"></label>
        <select id="route"></select>
      </fieldset>

      <fieldset>
        <legend data-i18n="s_energy"></legend>
        <div class="erow"><label for="electricity_mwh" data-i18n="elec"></label><div class="inp"><input id="electricity_mwh" type="number" min="0" step="any"><span>MWh</span></div><select id="q_elec" class="q"></select></div>
        <p class="hint" id="gridHint"></p>
        <div class="erow"><label for="solar_mwh" data-i18n="solar_own"></label><div class="inp"><input id="solar_mwh" type="number" min="0" step="any"><span>MWh</span></div><span></span></div>
        <div class="erow"><label for="gas_m3" data-i18n="gas"></label><div class="inp"><input id="gas_m3" type="number" min="0" step="any"><span>m³</span></div><select id="q_gas" class="q"></select></div>
        <div class="erow"><label for="diesel_l" data-i18n="diesel"></label><div class="inp"><input id="diesel_l" type="number" min="0" step="any"><span>L</span></div><select id="q_diesel" class="q"></select></div>
        <div class="erow"><label for="lpg_l" data-i18n="lpg"></label><div class="inp"><input id="lpg_l" type="number" min="0" step="any"><span>L</span></div><select id="q_lpg" class="q"></select></div>
        <div class="erow"><label for="coal_t" data-i18n="coal"></label><div class="inp"><input id="coal_t" type="number" min="0" step="any"><span>t</span></div><select id="q_coal" class="q"></select></div>
      </fieldset>

      <fieldset>
        <legend data-i18n="s_pre"></legend>
        <div class="row2">
          <div><label for="precursor_t" data-i18n="pre_qty"></label><div class="inp"><input id="precursor_t" type="number" min="0" step="any"><span>t</span></div></div>
          <div><label for="precursor_int" data-i18n="pre_int"></label><div class="inp"><input id="precursor_int" type="number" min="0" step="any"><span>tCO2e/t</span></div></div>
        </div>
        <label for="q_pre" data-i18n="quality"></label><select id="q_pre"></select>
      </fieldset>

      <fieldset>
        <legend data-i18n="s_cbam"></legend>
        <label for="default_value" data-i18n="default_value"></label>
        <div class="inp"><input id="default_value" type="number" min="0" step="any"><span>tCO2e/t</span></div>
        <p class="hint" id="defHint"></p>
        <div class="row2">
          <div><label for="bench_actual" data-i18n="bench_actual"></label><div class="inp"><input id="bench_actual" type="number" min="0" step="any"><span>tCO2e/t</span></div></div>
          <div><label for="price" data-i18n="price"></label><div class="inp"><input id="price" type="number" min="0" step="any"><span>€/tCO2e</span></div></div>
        </div>
      </fieldset>

      <div class="actions">
        <button type="submit" class="primary" data-i18n="btn_calc"></button>
        <button type="button" class="ghost" id="demo" data-i18n="btn_demo"></button>
        <button type="button" class="ghost" id="clear" data-i18n="btn_clear"></button>
        <button type="button" class="ghost" id="pSave" data-i18n="p_save"></button>
        <label class="ghost filebtn"><span data-i18n="p_open"></span><input type="file" id="pOpen" accept=".json,application/json" hidden></label>
      </div>
    </form>
  </aside>

  <section class="content">
    <nav class="tabs" role="tablist">

      <button type="button" role="tab" data-tab="supplier" data-i18n="tab_supplier"></button>
      <button type="button" role="tab" data-tab="report" data-i18n="tab_report"></button>

    <div class="tab" id="tab-res">

      <div class="card ready" id="readyCard"></div>

        <div class="kpi"><div class="l" data-i18n="k_default"></div><div class="v" id="kDef">-</div><div class="s">tCO2e/t</div></div>
        <div class="kpi good"><div class="l" data-i18n="k_saving"></div><div class="v" id="kSave">-</div><div class="s" id="kSaveT"></div></div>
        <div class="kpi"><div class="l" data-i18n="k_footprint"></div><div class="v" id="kFoot">-</div><div class="s">tCO2e</div></div>
      </div>
      <div class="card">
        <h2 data-i18n="cbam_title"></h2>
        <div class="split">
          <div class="tscroll"><table class="cmp" id="cmpTable"></table></div>
          <div><h3 class="mini" data-i18n="chart_title"></h3><div id="chart"></div></div>
        </div>
        <p class="note" id="scopeNote"></p>
        <p class="note" id="formula"></p>
      </div>
      <div class="card">
        <div class="cardhead"><h2 data-i18n="proj_title"></h2><div class="ctl"><label for="projSched" data-i18n="proj_sched"></label><select id="projSched"></select></div></div>
        <div id="projChart"></div>
        <div id="projSum" class="projsum"></div>
        <p class="note" data-i18n="proj_note"></p>
      </div>
      <div class="card">
        <h2 data-i18n="breakdown"></h2>
        <div class="tscroll"><table id="bdTable"></table></div>
      </div>
    </div>

    <div class="tab" id="tab-month" hidden>
      <div class="card">
        <h2 data-i18n="m_title"></h2>
        <p class="note" data-i18n="m_intro" style="margin:0 0 10px"></p>
        <div class="mbar">
          <button type="button" class="primary sm" id="mApply" data-i18n="m_apply"></button>
          <button type="button" class="ghost" id="mTpl" data-i18n="m_tpl"></button>
          <label class="ghost filebtn"><span data-i18n="m_upload"></span><input type="file" id="mFile" accept=".csv,.xlsx,.xls,text/csv" hidden></label>

        </div>
        <div id="mMsgs"></div>
        <div class="tscroll"><table id="mTable" class="mtable"></table></div>
      </div>
    </div>

    <div class="tab" id="tab-roadmap" hidden>
      <div class="card">
        <h2 data-i18n="rm_title"></h2>
        <p class="note" data-i18n="rm_intro" style="margin:0 0 10px"></p>
        <div class="row4">
          <div><label for="rmGas" data-i18n="rm_gas"></label><div class="inp"><input id="rmGas" type="number" min="0" step="any" value="0.40"><span>€/m³</span></div></div>

          <div><label for="rmRate" data-i18n="rm_rate"></label><div class="inp"><input id="rmRate" type="number" min="0" step="any" value="8"><span>%</span></div></div>
          <div><label for="rmGrowth" data-i18n="proj_growth"></label><div class="inp"><input id="rmGrowth" type="number" step="any" value="0"><span>%/yıl</span></div></div>
        </div>
        <div class="tscroll" style="margin-top:12px"><table id="rmTable" class="rmtable"></table></div>
        <div id="rmSum" class="rmsum"></div>
      </div>
      <div class="split2">
        <div class="card"><h2 data-i18n="macc_title"></h2><div id="maccChart"></div><p class="note" data-i18n="macc_note"></p></div>
        <div class="card"><h2 data-i18n="proj_title"></h2><div id="projChart2"></div><div id="projSum2" class="projsum"></div></div>
      </div>
    </div>

    <div class="tab" id="tab-solar" hidden>
      <div class="card">
        <h2 data-i18n="solar_title"></h2>

          <div><label for="s_kwp" data-i18n="kwp"></label><div class="inp"><input id="s_kwp" type="number" min="0" step="any" value="400"><span>kWp</span></div></div>

        <p class="note" data-i18n="solar_note"></p>

      </div>
    </div>

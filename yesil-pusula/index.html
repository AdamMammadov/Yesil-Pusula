        <label for="company" data-i18n="company"></label>

          <div><label for="country" data-i18n="country"></label><select id="country"></select></div>
          <div><label for="year" data-i18n="year"></label><select id="year"></select></div>

        <div id="scopeWrap" hidden><label for="scope" data-i18n="scope"></label><select id="scope"></select></div>
        <div class="row2">

          <div><label for="export_t" data-i18n="export"></label><div class="inp"><input id="export_t" type="number" min="0" step="any"><span>t</span></div></div>

        <label for="route" data-i18n="route"></label>
        <select id="route"></select>
      </fieldset>

      <fieldset>
        <legend data-i18n="s_energy"></legend>
        <div class="erow"><label for="electricity_mwh" data-i18n="elec"></label><div class="inp"><input id="electricity_mwh" type="number" min="0" step="any"><span>MWh</span></div><select id="q_elec" class="q"></select></div>

      </fieldset>

      <fieldset>
        <legend data-i18n="s_pre"></legend>

          <div><label for="precursor_t" data-i18n="pre_qty"></label><div class="inp"><input id="precursor_t" type="number" min="0" step="any"><span>t</span></div></div>
